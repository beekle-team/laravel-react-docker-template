version: 2

updates:
  # PHP 依存。minor / patch はまとめて 1 PR、major は個別 PR にして影響範囲を見て判断する。
  - package-ecosystem: composer
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(composer)"
    groups:
      composer-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # フロント依存。React 19 への major 更新は React Compiler の target 変更を伴うため、
  # まとめずに個別 PR で来るようにしておく。
  # Vite 8 / plugin-react 6 / TypeScript 7 / laravel-vite-plugin 3 は toolchain の専用作業。
  # Babel 8 / jsdom 30 / concurrently 10 は Node 22+ 前提で、CI はまだ Node 20。
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(npm)"
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: laravel-vite-plugin
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: concurrently
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile のベースイメージ。テンプレートは PHP 8.5 に統一する。
  # 8.6 への major は Composer / Rector / CI と同時に更新する専用作業にする。
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major"]

  # docker-compose.yml のサービスイメージ（postgres / redis / nginx）。
  # Dockerfile とは別 ecosystem なので個別に定義する。
  # Postgres 18 は既存 volume 非互換で、CI の service container もまだ 16。
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns:
          - "*"
