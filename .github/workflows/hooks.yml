name: Hook Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    name: Repository Guards

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify PHP version consistency
        run: bash scripts/check-php-version-consistency.sh

      - name: Execute hook regression tests
        run: |
          for test_file in .claude/hooks/tests/*-test.sh; do
            bash "$test_file"
          done

      - name: Execute bootstrap script regression tests
        run: |
          for test_file in tests/shell/*-test.sh; do
            bash "$test_file"
          done
