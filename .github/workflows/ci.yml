name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]

    name: Lint (PHP ${{ matrix.php }})

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Execute Pint (Linting)
      run: ./vendor/bin/pint --test

    - name: Execute Larastan (Static Analysis)
      run: ./vendor/bin/phpstan analyse --memory-limit=2G

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    name: Frontend Quality

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/package-lock.json

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies
      run: npm ci

    - name: Generate Wayfinder Routes
      run: php artisan wayfinder:generate --with-form

    - name: Execute Biome
      run: npm run lint:js

    - name: Execute TypeScript
      run: npm run types

    - name: Execute React Compiler Check
      run: npm run lint:react-compiler

    - name: Execute Dead Code Scan
      run: npm run lint:dead-code

    - name: Execute Duplication Scan
      run: npm run lint:duplication

    - name: Execute Frontend Unit Tests
      run: npm run test:unit

  tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src

    # Service container for PostgreSQL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]

    name: Tests (PHP ${{ matrix.php }})

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/package-lock.json

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies
      run: npm ci

    - name: Generate Key
      run: php artisan key:generate

    - name: Build Frontend Assets
      run: npm run build

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Execute Tests (Unit and Feature)
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan test

  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    name: E2E (Playwright)

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/package-lock.json

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies
      run: npm ci

    - name: Generate Key
      run: php artisan key:generate

    - name: Prepare Database
      run: |
        touch database/database.sqlite
        php artisan migrate --force

    - name: Build Frontend Assets
      run: npm run build

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # Playwright の webServer が php artisan serve を起動するため、
    # ここではブラウザだけ用意する。3 ブラウザ分の依存は重いので CI は chromium に絞る。
    - name: Install Playwright Browser
      run: npx playwright install --with-deps chromium

    - name: Execute E2E Tests
      run: npx playwright test --project=chromium

    - name: Upload Playwright Report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: src/playwright-report
        retention-days: 7
